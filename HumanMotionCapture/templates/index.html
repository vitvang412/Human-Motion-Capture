<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Motion Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* DESIGN SYSTEM: PASTEL YELLOW MINIMAL ELEGANT */
        :root {
            --bg-base: #FFFBF2;
            --bg-panel: #FFFFFF;
            --primary: #D4AF37; /* Elegant Gold */
            --primary-hover: #C5A028;
            --text-main: #2C2A26;
            --text-muted: #7A766C;
            --border: #E8E3D5;
            
            --color-stand: #739E82; /* Sage Green */
            --color-sit: #D4AF37;   /* Gold */
            --color-bend: #C87979;  /* Muted Rose */
            
            --shadow-sm: 0 4px 12px rgba(212, 175, 55, 0.05);
            --shadow-md: 0 12px 32px rgba(212, 175, 55, 0.08);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        /* NAVBAR */
        nav {
            padding: 1.5rem 3rem;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: var(--shadow-sm);
        }
        nav h1 { 
            font-size: 1.8rem; 
            font-weight: 600; 
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        nav svg { width: 28px; height: 28px; fill: var(--primary); }

        /* VÙNG CHỨA CHÍNH */
        .container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 3rem 2rem; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 1. KHU VỰC UPLOAD */
        #upload-section {
            width: 100%; 
            max-width: 600px; 
            margin-top: 3rem;
            display: flex; 
            flex-direction: column; 
            gap: 1rem;
        }
        
        .dropzone {
            width: 100%; 
            height: 320px;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background: var(--bg-panel);
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }
        .dropzone:hover, .dropzone.dragover { 
            border-color: var(--primary); 
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .dropzone svg { 
            width: 48px; 
            height: 48px; 
            fill: var(--text-muted); 
            margin-bottom: 1.5rem; 
            transition: fill 0.3s; 
        }
        .dropzone:hover svg, .dropzone.dragover svg { fill: var(--primary); }
        .dropzone p { font-size: 1.2rem; color: var(--text-main); font-weight: 500; font-family: 'Cormorant Garamond', serif;}
        .dropzone span { font-size: 0.95rem; color: var(--text-muted); margin-top: 0.5rem; font-weight: 300; }
        
        #file-input { display: none; }
        
        /* 2. KHU VỰC PREVIEW (Sau khi chọn ảnh) */
        #preview-section { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            gap: 2rem; 
        }
        #preview-img { 
            max-width: 100%; 
            max-height: 500px; 
            border-radius: 8px; 
            object-fit: contain; 
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        
        .btn-group { display: flex; gap: 1rem; }
        button {
            padding: 0.8rem 2.5rem; 
            border: 1px solid transparent; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            cursor: pointer; 
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }
        button:active { transform: scale(0.98); }
        .btn-analyze { 
            background: var(--primary); 
            color: #fff; 
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
        }
        .btn-analyze:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        .btn-secondary { 
            background: transparent; 
            color: var(--text-main); 
            border-color: var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-panel);
            border-color: var(--text-muted);
        }

        /* LOADING OVERLAY */
        #loading-overlay {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 251, 242, 0.9); 
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; 
            border: 3px solid var(--border);
            border-top-color: var(--primary); 
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
            margin-bottom: 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { 
            font-size: 1.2rem; 
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500; 
            color: var(--text-main); 
            letter-spacing: 0.5px;
        }

        /* 3. KHU VỰC KẾT QUẢ */
        #result-section { 
            display: none; 
            width: 100%; 
            gap: 2rem; 
            margin-top: 1rem; 
            flex-direction: column;
        }
        .col { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem; 
            background: var(--bg-panel); 
            padding: 2rem; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-sm);
        }
        
        /* Cột Trái: Toggle Ảnh */
        .image-toggle { 
            display: flex; 
            gap: 0.5rem; 
            background: var(--bg-base); 
            padding: 0.5rem; 
            border-radius: 8px; 
            border: 1px solid var(--border);
        }
        .toggle-btn { 
            flex: 1; 
            background: transparent; 
            color: var(--text-muted); 
            padding: 0.6rem; 
            transition: all 0.3s; 
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .toggle-btn.active { background: var(--bg-panel); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .result-img-container { 
            width: 100%; 
            aspect-ratio: 4/3; 
            background: #FAFAFA; 
            border-radius: 8px; 
            border: 1px solid var(--border);
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .result-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .result-img-container img.active { display: block; animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Cột Phải: Dữ liệu phân tích */
        #pose-label { 
            font-size: 2.5rem; 
            font-weight: 600; 
            letter-spacing: 1px;
            text-transform: uppercase; 
            margin-bottom: -0.2rem;
        }
        .label-stand { color: var(--color-stand); }
        .label-sit { color: var(--color-sit); }
        .label-bend { color: var(--color-bend); }
        .label-unknown { color: var(--text-muted); }

        .confidence-container { width: 100%; background: var(--bg-base); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 0.8rem; }
        #confidence-bar { height: 100%; background: var(--primary); width: 0%; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
        #confidence-text { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.5rem; display: block; }
        
        #pose-reason { 
            font-style: italic; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            line-height: 1.6; 
            padding-left: 1rem; 
            border-left: 2px solid var(--border); 
            font-family: 'Cormorant Garamond', serif;
        }

        .angles-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.95rem;}
        .angles-table th, .angles-table td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        .angles-table th { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .angles-table td strong { color: var(--text-main); font-weight: 500;}
        
        /* Three.js Canvas */
        #three-canvas-container { 
            width: 100%; 
            height: 380px; 
            background: var(--bg-base); 
            border-radius: 12px; 
            overflow: hidden; 
            margin-top: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .mt-2 { margin-top: 2rem; }
        .w-100 { width: 100%; }

        @media (min-width: 992px) {
            #result-section { flex-direction: row; }
        }
    </style>
</head>
<body>

    <nav>
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <h1 class="serif">Human Motion Capture</h1>
    </nav>

    <div class="container">
        
        <!-- 1. VÙNG UPLOAD -->
        <div id="upload-section">
            <div class="dropzone" id="dropzone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <p>Kéo & thả ảnh vào đây</p>
                <span>hoặc click để chọn tệp định dạng JPG, PNG</span>
                <input type="file" id="file-input" accept=".jpg, .jpeg, .png">
            </div>
        </div>

        <!-- 2. VÙNG PREVIEW -->
        <div id="preview-section">
            <img id="preview-img" src="" alt="Preview">
            <div class="btn-group">
                <button class="btn-secondary" onclick="resetApp()">Chọn ảnh khác</button>
                <button class="btn-analyze" onclick="analyzeImage()">Phân Tích Dữ Liệu</button>
            </div>
        </div>

        <!-- 3. VÙNG KẾT QUẢ -->
        <div id="result-section">
            <!-- Cột trái: Hình ảnh -->
            <div class="col">
                <div class="image-toggle">
                    <button id="btn-original" class="toggle-btn active" onclick="toggleImage('original')">Ảnh Gốc</button>
                    <button id="btn-skeleton" class="toggle-btn" onclick="toggleImage('skeleton')">Khung Xương</button>
                </div>
                <div class="result-img-container">
                    <img id="original-img" class="active" src="" alt="Original">
                    <img id="skeleton-img" src="" alt="Skeleton">
                </div>
            </div>

            <!-- Cột phải: Dữ liệu phân tích -->
            <div class="col">
                <div>
                    <h2 id="pose-label">ĐỨNG THẲNG</h2>
                    <div class="confidence-container">
                        <div id="confidence-bar"></div>
                    </div>
                    <span id="confidence-text">Độ tự tin: 0%</span>
                </div>
                
                <p id="pose-reason">Đang phân tích lý do...</p>

                <!-- Bảng hiển thị góc -->
                <div style="max-height: 200px; overflow-y: auto;">
                    <table class="angles-table">
                        <thead>
                            <tr>
                                <th>Tên Khớp</th>
                                <th>Góc Đo (Độ)</th>
                            </tr>
                        </thead>
                        <tbody id="angles-body">
                            <!-- JS gen nội dung vào đây -->
                        </tbody>
                    </table>
                </div>

                <div id="three-canvas-container">
                    <div id="three-loading-msg" style="color: #7A766C; font-size: 0.95rem;">Kết quả mô phỏng 3D sẽ hiển thị tại đây...</div>
                </div>
            </div>
        </div>

        <button id="btn-restart" class="btn-secondary mt-2 w-100" style="display:none; max-width: 400px;" onclick="resetApp()">Phân Tích Ảnh Mới</button>
    </div>

    <!-- MÀN HÌNH LOADING -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Đang nhận diện khung xương...</div>
    </div>

    <!-- LOGIC ĐIỀU KHIỂN GIAO DIỆN -->
    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const uploadSection = document.getElementById('upload-section');
        const previewSection = document.getElementById('preview-section');
        const resultSection = document.getElementById('result-section');
        
        const previewImg = document.getElementById('preview-img');
        const originalImg = document.getElementById('original-img');
        const skeletonImg = document.getElementById('skeleton-img');
        const btnRestart = document.getElementById('btn-restart');

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        let currentFile = null;

        // Xử lý sự kiện Drag & Drop
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files[0]);
        });
        
        // Xử lý Click upload
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFileSelect(e.target.files[0]);
        });

        function handleFileSelect(file) {
            if (!file.type.match('image/(jpeg|jpg|png)')) {
                alert('Vui lòng chọn tệp hình ảnh định dạng JPG hoặc PNG.');
                return;
            }
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                previewImg.src = dataUrl;
                originalImg.src = dataUrl; 
                
                uploadSection.style.display = 'none';
                previewSection.style.display = 'flex';
                resultSection.style.display = 'none';
                btnRestart.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        const loadingScenarios = [
            { time: 0, text: "Đang nhận diện khung xương..." },
            { time: 2000, text: "Đang tính toán góc khớp..." },
            { time: 4000, text: "Đang phân loại tư thế..." },
            { time: 6000, text: "Đang chuẩn bị dữ liệu 3D..." }
        ];

        async function analyzeImage() {
            if (!currentFile) return;

            loadingOverlay.style.display = 'flex';
            let timeouts = [];
            loadingScenarios.forEach(scenario => {
                timeouts.push(setTimeout(() => { loadingText.innerText = scenario.text; }, scenario.time));
            });

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (!data.success) {
                    alert("Đã xảy ra lỗi: " + data.error);
                    return;
                }
                
                renderResults(data);

            } catch (error) {
                console.error(error);
                alert("Không thể kết nối đến máy chủ. Vui lòng thử lại.");
            } finally {
                timeouts.forEach(clearTimeout);
                loadingOverlay.style.display = 'none';
                loadingText.innerText = "Đang xử lý...";
            }
        }

        function renderResults(data) {
            previewSection.style.display = 'none';
            resultSection.style.display = 'flex';
            btnRestart.style.display = 'block';

            skeletonImg.src = data.skeleton_image_base64;
            toggleImage('skeleton'); 

            const labelEl = document.getElementById('pose-label');
            labelEl.innerText = data.pose_label;
            labelEl.className = 'serif'; 
            if (data.pose_label.includes('ĐỨNG')) labelEl.classList.add('label-stand');
            else if (data.pose_label.includes('NGỒI')) labelEl.classList.add('label-sit');
            else if (data.pose_label.includes('CÚI')) labelEl.classList.add('label-bend');
            else labelEl.classList.add('label-unknown');

            setTimeout(() => {
                document.getElementById('confidence-bar').style.width = `${data.confidence}%`;
            }, 100);
            document.getElementById('confidence-text').innerText = `Độ tự tin: ${data.confidence}%`;
            document.getElementById('pose-reason').innerText = data.reason;

            const tbody = document.getElementById('angles-body');
            tbody.innerHTML = '';
            for (const [key, value] of Object.entries(data.angles)) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${key.toUpperCase()}</td><td><strong>${value}°</strong></td>`;
                tbody.appendChild(tr);
            }

            if (window.updateThreeJSPose) {
                window.updateThreeJSPose(data.pose_3d, data.landmarks);
            }
        }

        function toggleImage(type) {
            const btnOriginal = document.getElementById('btn-original');
            const btnSkeleton = document.getElementById('btn-skeleton');

            if (type === 'original') {
                btnOriginal.classList.add('active');
                btnSkeleton.classList.remove('active');
                originalImg.classList.add('active');
                skeletonImg.classList.remove('active');
            } else {
                btnSkeleton.classList.add('active');
                btnOriginal.classList.remove('active');
                skeletonImg.classList.add('active');
                originalImg.classList.remove('active');
            }
        }

        function resetApp() {
            currentFile = null;
            fileInput.value = '';
            document.getElementById('confidence-bar').style.width = '0%';
            
            uploadSection.style.display = 'flex';
            previewSection.style.display = 'none';
            resultSection.style.display = 'none';
            btnRestart.style.display = 'none';
        }
    </script>

    <!-- Three.js + Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Viewer script (Cache buster v12 to ensure latest changes load) -->
    <script src="/static/js/viewer.js?v=12"></script>

</body>
</html>
